services:
  postgres:
    image: postgres:16
    container_name: receipt-tracker-postgres
    environment:
      POSTGRES_DB: receipt_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - receipt_tracker_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d receipt_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: receipt-tracker-redis
    ports:
      - "6379:6379"
    volumes:
      - receipt_tracker_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: receipt-tracker-backend
    env_file:
      - ./.env
    environment:
      POSTGRES_DSN: postgresql+psycopg://postgres:postgres@postgres:5432/receipt_tracker
      REDIS_URL: redis://redis:6379/0
      LOCAL_UPLOADS_DIR: /var/data/receipt_uploads
      BACKEND_CORS_ORIGINS: http://localhost:3022,http://localhost:3000,http://localhost:8081
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - receipt_tracker_uploads:/var/data/receipt_uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  receipt_tracker_postgres:
  receipt_tracker_redis:
  receipt_tracker_uploads:
