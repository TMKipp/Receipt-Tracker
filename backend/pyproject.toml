[project]
name = "receipt-tracker-backend"
version = "0.1.0"
description = "Starter FastAPI backend for a receipt tracking app"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.15,<2.0",
  "pydantic-settings>=2.8,<3.0",
  "python-dotenv>=1.0,<2.0",
  "pyjwt[crypto]>=2.10,<3.0",
  "httpx>=0.28,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "cryptography>=44.0,<45.0",
  "boto3>=1.37,<2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
receipt-tracker-worker = "app.worker:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
