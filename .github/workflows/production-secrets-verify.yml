name: Production Secrets Verify

on:
  workflow_dispatch:

jobs:
  verify-production-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run production readiness policy checks
        env:
          APP_ENV: production
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          APP_AUTO_CREATE_SCHEMA: "false"
          BACKEND_CORS_ORIGINS: ${{ secrets.BACKEND_CORS_ORIGINS }}
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          DEV_AUTH_ENABLED: "false"
          STORAGE_PROVIDER: s3
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          OPENAI_ENABLED: "true"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QBO_CLIENT_ID: ${{ secrets.QBO_CLIENT_ID }}
          QBO_CLIENT_SECRET: ${{ secrets.QBO_CLIENT_SECRET }}
          QBO_REDIRECT_URI: ${{ secrets.QBO_REDIRECT_URI }}
          QBO_BASE_URL: https://quickbooks.api.intuit.com
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_REDIRECT_URI: ${{ secrets.MS_REDIRECT_URI }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_JWKS_URL: ${{ secrets.SUPABASE_JWKS_URL }}
          SUPABASE_JWT_ISSUER: ${{ secrets.SUPABASE_JWT_ISSUER }}
          REVENUECAT_WEBHOOK_AUTHORIZATION: ${{ secrets.REVENUECAT_WEBHOOK_AUTHORIZATION }}
          REVENUECAT_ENTITLEMENT_KEY: ${{ secrets.REVENUECAT_ENTITLEMENT_KEY }}
          SYNC_RUN_INLINE: "false"
        run: |
          node scripts/launch-readiness-check.mjs --production --strict --json > production-readiness-report.json
      - name: Upload production readiness report
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-report
          path: production-readiness-report.json
